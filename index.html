<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarif Hazari | Electrical and Electronics Engineer</title>
<meta name="description" content="Portfolio of Tarif Hazari: Electrical and Electronics Engineer, neuromorphic engineering and neural computing.">
<style>
:root{--bg:#e0f7fa;--surface:#d2f1f6;--text:#000;--muted:#2f4a50;--link:#b8860b;--border:#9fd3db;--hdr:#e0f7fa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--surface:#131a22;--text:#fff;--muted:#aab4bf;--link:#4a73ff;--border:#26323f;--hdr:#0b0f14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f14;--surface:#131a22;--text:#fff;--muted:#aab4bf;--link:#4a73ff;--border:#26323f;--hdr:#0b0f14;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Times New Roman",Times,serif;font-size:11pt;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
sup.arr{font-size:.8em;margin-left:1px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hdr);border-bottom:1px solid var(--border);z-index:11}
.bar{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:bold;color:var(--text)}
nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
nav a{color:var(--text)}
nav a:hover{color:var(--link)}
button{font:inherit;cursor:pointer}
#theme{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:3px 12px}
main{max-width:920px;margin:0 auto;padding:0 20px 40px}
section{padding:36px 0 8px}
h1{font-size:2.3em;line-height:1.15;margin:0 0 6px}
h2{font-size:1.5em;margin:0 0 14px;padding-bottom:6px;border-bottom:1px solid var(--border)}
h3{font-size:1.1em;margin:0}
.hero{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center;padding-top:40px}
.photo{width:170px;height:170px;border-radius:50%;border:2px dashed var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.85em;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.headline{color:var(--muted);margin:0 0 14px}
.bio{margin:0 0 16px;font-style:italic}
.meta{color:var(--muted);margin:0 0 16px}
.toprow{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 16px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:7px 16px;border:1px solid var(--text);border-radius:6px;background:transparent;color:var(--text)}
.btn:hover{background:var(--text);color:var(--bg);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sub{color:var(--muted);font-size:.92em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:1px solid var(--border);border-radius:999px;padding:0 10px;font-size:.9em}
.ph{color:var(--muted);font-style:italic}
p{margin:0 0 10px}
footer{max-width:920px;margin:0 auto;padding:18px 20px 30px;border-top:1px solid var(--border);color:var(--muted);font-size:.9em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (max-width:640px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.btns,.toprow{justify-content:center}h1{font-size:1.9em}nav .hide{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand" id="brand"></span>
  <nav>
    <a class="hide" href="#about">About</a><a class="hide" href="#research">Research</a><a class="hide" href="#projects">Projects</a><a class="hide" href="#education">Education</a><a href="#contact">Contact</a>
    <button id="theme" type="button" aria-label="Toggle light and dark mode">Dark</button>
  </nav>
</div></header>

<main>
  <div class="hero" id="top">
    <div class="photo" id="photo"></div>
    <div>
      <h1 id="name"></h1>
      <p class="headline" id="headline"></p>
      <p class="bio" id="bio"></p>
      <p class="meta" id="loc"></p>
      <div class="toprow" id="toprow"></div>
      <div class="btns" id="cvs"></div>
    </div>
  </div>

  <section id="about"><h2>About</h2><div id="aboutBody"></div><div class="tags" id="interests"></div></section>
  <section id="research"><h2>Research and Thesis</h2><div id="thesis"></div></section>
  <section id="projects"><h2>Projects</h2><div class="grid" id="projGrid"></div></section>
  <section id="education"><h2>Education</h2><div id="eduList"></div></section>
  <section id="skills"><h2>Skills</h2><div class="grid" id="skillGrid"></div></section>
  <section id="contact"><h2>Contact</h2><div class="card" id="contactBox"></div></section>
</main>
<footer id="foot"></footer>
<div id="toast" role="status"></div>

<script>
/* ============ CUSTOMIZE HERE ============
   Edit this block to update the whole site. Leave a value empty ("" or [])
   to hide it or show a placeholder. */
const CONFIG = {
  name: "Tarif Hazari",
  headline: "Electrical and Electronics Engineer | Neuromorphic Engineering Enthusiast | Neural Computing and Technology",
  bio: "Hi there! This time it is not what you thought before. It is what you are doing now you never thought. Yes! I am trying to bridge these two kinds in an uninteresting way for others, and in a very enthusiastic way for myself this time. “Yeah, Mr. White! Yeah, science!”",
  location: "Chattogram, Bangladesh-4202",
  email: "hazaritarif@gmail.com",
  photo: "",   // paste an image data URL here later; empty shows a placeholder
  links: [
    { label: "LinkedIn Profile",     url: "https://www.linkedin.com/in/tarifhazari" },
    { label: "ResearchGate Profile", url: "https://www.researchgate.net/profile/Tarif-Hazari" },
    { label: "ORCID ID",             url: "https://orcid.org/0009-0003-0763-3759" }
  ],
  cvs: [
    { label: "Academic CV",           url: "" },   // add file link later
    { label: "Professional Resume",   url: "" }
  ],
  about: [
    "I am an Electrical and Electronics Engineer working at the verge of merging electronics and neural computing, with a particular interest in neuromorphic engineering.",
    "🌏 Love to learn and explore diverse things- travel in nature, explore music, philosophy, tech. & AI, neuroscience, cinemas and geopolitics- most.

🎓 With thorough coursework and exposure in cutting-edge research and automation training, I completed my graduation in 2024 from the University of Dhaka. Developed academic research focus -from the Ohm's Law to the Moore's Law- towards Neuromorphic Computing. 

📊 Precisely utilized CAD tools for coding, circuit design & simulation for the Thesis in Neuromorphic Computing. Continously leveraging AI tools for productive learning.

📈 Interested in multi-disciplinary domains to bring a sophisticated, innovative approach in the current technological landscape.

🧬 At the end of the day, the driving philosophy behind human psychology -evolving from the early times to the 21st century AI- drives us all.


Better reach @

📧 hazaritarif@gmail.com

Services"
  ],
  interests: ["Neuromorphic Engineering", "Neural Computing", "Electrical and Electronics Engineering"],
  thesis: {
    title: "Memristor-Based Modified Synapse Circuit for Low-Power Neuromorphic Computing",
    supervisor: "[Supervisor name]",
    abstract: "[Add a 3 to 4 line abstract and your key results here.]",
    link: ""
  },
  projects: [
    { name: "[Project name 1]", desc: "[One-line description]", tools: [], link: "" },
    { name: "[Project name 2]", desc: "[One-line description]", tools: [], link: "" },
    { name: "[Project name 3]", desc: "[One-line description]", tools: [], link: "" }
  ],
  education: [
    { school: "Barishal Engineering College, University of Dhaka", detail: "B.Sc. in Electrical and Electronics Engineering, Faculty of Engineering and Technology", years: "" }
  ],
  skills: [
    { group: "Technical", items: [] },
    { group: "Software and Tools", items: [] }
  ]
};
/* ========== END CUSTOMIZE ========== */

const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function ext(label, url){ const a = el("a"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.append(document.createTextNode(label)); const s = el("sup","arr","↗"); s.setAttribute("aria-hidden","true"); a.append(s); return a; }
function ph(t){ return el("p","ph",t); }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }

const C = CONFIG;
document.title = C.name + " | Electrical and Electronics Engineer";
$("brand").textContent = C.name;
$("name").textContent = C.name;
$("headline").textContent = C.headline;
$("bio").textContent = C.bio;
$("loc").textContent = C.location;
{ const r = $("toprow"); const m = el("a","",C.email); m.href = "mailto:" + C.email; r.append(m); C.links.forEach(l => r.append(ext(l.label, l.url))); }
$("foot").textContent = "© " + new Date().getFullYear() + " " + C.name;

const photo = $("photo");
if (C.photo) { const i = el("img"); i.src = C.photo; i.alt = "Portrait of " + C.name; photo.style.border = "none"; photo.append(i); }
else photo.textContent = "Profile photo placeholder";

C.cvs.forEach(cv => {
  const b = el("a","btn","⬇ " + cv.label);
  if (cv.url) { b.href = cv.url; b.target = "_blank"; b.rel = "noopener noreferrer"; b.setAttribute("download",""); }
  else { b.href = "#"; b.addEventListener("click", e => { e.preventDefault(); toast(cv.label + " file has not been added yet"); }); }
  $("cvs").append(b);
});

C.about.forEach(t => $("aboutBody").append(t.startsWith("[") ? ph(t) : el("p", "", t)));
C.interests.forEach(t => $("interests").append(el("span","tag",t)));

const th = $("thesis"), card = el("div","card");
card.append(el("h3","",C.thesis.title));
if (C.thesis.supervisor) card.append(el("div","sub","Supervisor: " + C.thesis.supervisor));
card.append(el("p","",C.thesis.abstract));
if (C.thesis.link) card.append(ext("Read the thesis", C.thesis.link));
th.append(card);

C.projects.forEach(p => {
  const c = el("div","card"); c.append(el("h3","",p.name), el("p","sub",p.desc));
  if (p.tools && p.tools.length){ const t = el("div","tags"); p.tools.forEach(x => t.append(el("span","tag",x))); c.append(t); }
  if (p.link){ const d = el("div"); d.style.marginTop = "8px"; d.append(ext("View project", p.link)); c.append(d); }
  $("projGrid").append(c);
});

C.education.forEach(e => {
  const c = el("div","card"); c.append(el("h3","",e.school), el("div","sub",e.detail));
  if (e.years) c.append(el("div","sub",e.years));
  $("eduList").append(c);
});

C.skills.forEach(s => {
  const c = el("div","card"); c.append(el("h3","",s.group));
  if (s.items.length){ const t = el("div","tags"); s.items.forEach(x => t.append(el("span","tag",x))); c.append(t); }
  else c.append(ph("[Add skills here]"));
  $("skillGrid").append(c);
});

const cb = $("contactBox");
const em = el("p"); em.append(document.createTextNode("Email: ")); const ea = el("a","",C.email); ea.href = "mailto:" + C.email; em.append(ea); cb.append(em);
C.links.forEach(l => { const p = el("p"); p.append(ext(l.label, l.url)); cb.append(p); });
cb.append(el("p","sub","Location: " + C.location));

/* Theme toggle */
const root = document.documentElement, tbtn = $("theme");
function isDark(){ const t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function sync(){ tbtn.textContent = isDark() ? "Light" : "Dark"; }
try { const s = localStorage.getItem("theme"); if (s) root.setAttribute("data-theme", s); } catch(e){}
sync();
tbtn.addEventListener("click", () => {
  const n = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", n);
  try { localStorage.setItem("theme", n); } catch(e){}
  sync();
});
</script>
</body>
</html>
